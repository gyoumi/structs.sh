# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: >
  Be direct and specific. Point to exact lines/functions rather than
  general remarks. Skip praise and filler.

reviews:
  profile: "chill"
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  path_filters:
    - "!**/*.lock"
    - "!uv.lock"
    - "!**/__pycache__/**"
    - "!**/.venv/**"
    - "!**/dist/**"
    - "!**/build/**"

  tools:
    gitleaks:
      enabled: true
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
  issues:
    scope: "auto"