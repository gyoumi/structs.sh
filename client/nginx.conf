# This file mainly exists to solve this issue with React Router:
# https://stackoverflow.com/questions/43951720/react-router-and-nginx
events {
    # This must be here for the .conf file to be considered valid.
}
http {
    include /etc/nginx/mime.types;

    # Serve the .gz copies Dockerfile.prod makes of large files (the in-browser
    # compiler is about 105 MB, 30 MB gzipped), and compress the rest here.
    gzip_static on;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # This `server` config block makes it so that any request to 
    # Structs.sh/* will get directed to our built React project. 
    server {
        listen 80;
        server_name structs.sh;

        root /usr/share/nginx/html/;
        index /index.html;

        # Vite puts a hash of each file's contents in its name under /assets/,
        # so a changed file gets a new name and browsers can keep these for
        # good. A second visit then loads the compiler from the browser's cache.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
