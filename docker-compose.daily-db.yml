services:
  daily-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daily
      POSTGRES_PASSWORD: daily
      POSTGRES_DB: daily_challenges
    ports:
      - "127.0.0.1:${DAILY_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily -d daily_challenges"]
      interval: 2s
      timeout: 3s
      retries: 15
