packages:
  - client

# Every package uses the client's React.
overrides:
  react: ^19.2.0
  react-dom: ^19.2.0

# These packages declare old peer ranges but work with the versions we use.
peerDependencyRules:
  allowedVersions:
    flux>react: '19'
    react-json-view>react: '19'
    react-json-view>react-dom: '19'
    react-remove-scroll>@types/react: '19'
    '@pigment-css/vite-plugin>vite': '8'

# These install scripts only rebuild or check native binaries that already
# ship prebuilt, so they don't need to run.
allowBuilds:
  '@parcel/watcher': false
  fsevents: false
  unrs-resolver: false
