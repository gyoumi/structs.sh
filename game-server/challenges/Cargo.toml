[package]
name = "daily-challenges"
version = "0.1.0"
edition = "2024"
publish = false
description = "Challenge templates, step logs, and scoring for the daily challenge"

[lib]
# cdylib is the .wasm the browser loads; rlib lets the Rust tests call it.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
