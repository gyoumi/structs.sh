[package]
name = "daily-db"
version = "0.1.0"
edition = "2024"
publish = false
description = "Postgres schema, migrations, and queries for the daily challenge"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
daily-challenges = { path = "../challenges" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
