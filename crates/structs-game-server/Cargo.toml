[package]
name = "structs-game-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Read-only HTTP server serving today's daily puzzle for structs.sh"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
structs-game-api = { path = "../structs-game-api" }
structs-game-db = { path = "../structs-game-db" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
structs-puzzles = { path = "../structs-puzzles" }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
