[package]
name = "structs-game-db"
version = "0.1.0"
edition = "2024"
publish = false
description = "Postgres schema, migrations, and queries for the structs.sh daily game"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate"] }
structs-puzzles = { path = "../structs-puzzles" }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
