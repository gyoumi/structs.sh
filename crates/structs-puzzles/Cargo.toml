[package]
name = "structs-puzzles"
version = "0.1.0"
edition = "2024"
publish = false
description = "Puzzle templates, step logs, and scoring for the structs.sh daily game"

[lib]
# cdylib is the .wasm the browser loads; rlib lets the Rust tests call it.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
