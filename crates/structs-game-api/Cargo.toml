[package]
name = "structs-game-api"
version = "0.1.0"
edition = "2024"
publish = false
description = "HTTP API types for the structs.sh daily game, exported to TypeScript via ts-rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ts-rs = "11"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
