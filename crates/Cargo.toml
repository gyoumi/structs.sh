[workspace]
members = ["structs-puzzles", "structs-game-db"]
resolver = "3"

# Clippy reads the thresholds from clippy.toml, not from here.
[workspace.lints.clippy]
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
