services:
  game-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: structs
      POSTGRES_PASSWORD: structs
      POSTGRES_DB: structs_game
    ports:
      - "${GAME_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U structs -d structs_game"]
      interval: 2s
      timeout: 3s
      retries: 15
