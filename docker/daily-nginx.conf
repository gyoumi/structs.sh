# The client's nginx config for docker-compose.daily.yml: the production rules
# from client/nginx.conf, plus /api/ sent to the game server. The game
# server's test clock (/clock) is never proxied.
events {
    # This must be here for the .conf file to be considered valid.
}
http {
    include /etc/nginx/mime.types;

    # Serve the .gz copies Dockerfile.prod makes of large files, and compress
    # the rest here.
    gzip_static on;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    server {
        listen 80;
        server_name structs.sh;

        root /usr/share/nginx/html/;
        index /index.html;

        # Vite hashes each file's contents into its name under /assets/, so
        # browsers can keep these for good.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://game-server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
