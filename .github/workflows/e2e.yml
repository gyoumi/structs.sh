name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The debugger is started here rather than by Playwright, because it is
      # the part being replaced. Update this step and "Wait for debugger" when
      # the backend changes. The image builds in the background while the
      # next steps install the frontend and browser.
      - name: Start debugger
        run: |
          (
            status=0
            docker compose up -d --build debugger > "$RUNNER_TEMP/debugger-up.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/debugger-up.exit"
          ) > /dev/null 2>&1 &

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true

      # The runner image already has Chrome's system libraries, so only the
      # headless shell is downloaded.
      - name: Install browser
        run: pnpm exec playwright install --only-shell chromium

      - name: Type-check e2e
        run: pnpm run e2e:typecheck

      - name: Wait for debugger
        run: |
          timeout 300 bash -c 'until [ -f "$RUNNER_TEMP/debugger-up.exit" ]; do sleep 1; done' || true
          cat "$RUNNER_TEMP/debugger-up.log"
          [ -f "$RUNNER_TEMP/debugger-up.exit" ] || { echo "Debugger build did not finish in 300s"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/debugger-up.exit")" = 0 ]
          timeout 120 bash -c 'until curl -sf "http://localhost:8000/dapi/?EIO=4&transport=polling" >/dev/null; do sleep 2; done'

      - name: Run e2e tests
        run: pnpm run e2e

      - name: Debugger logs
        if: failure()
        run: docker compose logs debugger

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
