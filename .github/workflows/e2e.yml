name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.debugger }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same suite runs against the GDB debugger on the server and the wasm
    # debugger in the browser. Each has its own list in e2e/known-failures/.
    strategy:
      fail-fast: false
      matrix:
        debugger: [gdb, wasm]
    env:
      E2E_DEBUGGER: ${{ matrix.debugger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The GDB debugger is started here rather than by Playwright, because it
      # is the part being replaced. The image builds in the background while
      # the next steps install the frontend and browser. The wasm debugger
      # needs no server.
      - name: Start debugger
        if: matrix.debugger == 'gdb'
        run: |
          (
            status=0
            docker compose up -d --build debugger > "$RUNNER_TEMP/debugger-up.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/debugger-up.exit"
          ) > /dev/null 2>&1 &

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true

      # The runner image already has Chrome's system libraries, so only the
      # headless shell is downloaded.
      - name: Install browser
        run: pnpm exec playwright install --only-shell chromium

      # The wasm debugger loads the instrumenter's .wasm, built from
      # instrumenter/ with the Rust in rust-toolchain.toml.
      - name: Build instrumenter
        if: matrix.debugger == 'wasm'
        run: |
          rustup toolchain install
          pnpm run instrumenter

      - name: Type-check e2e
        run: pnpm run e2e:typecheck

      - name: Wait for debugger
        if: matrix.debugger == 'gdb'
        run: |
          timeout 300 bash -c 'until [ -f "$RUNNER_TEMP/debugger-up.exit" ]; do sleep 1; done' || true
          cat "$RUNNER_TEMP/debugger-up.log"
          [ -f "$RUNNER_TEMP/debugger-up.exit" ] || { echo "Debugger build did not finish in 300s"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/debugger-up.exit")" = 0 ]
          timeout 120 bash -c 'until curl -sf "http://localhost:8000/dapi/?EIO=4&transport=polling" >/dev/null; do sleep 2; done'

      - name: Run e2e tests
        run: pnpm run e2e

      - name: Debugger logs
        if: failure() && matrix.debugger == 'gdb'
        run: docker compose logs debugger

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.debugger }}
          path: e2e/playwright-report
          retention-days: 7
