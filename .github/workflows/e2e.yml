name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true

      # The runner image already has Chrome's system libraries, so only the
      # headless shell is downloaded.
      - name: Install browser
        run: pnpm exec playwright install --only-shell chromium

      # The debugger loads the instrumenter's .wasm, built from instrumenter/
      # with the Rust in rust-toolchain.toml.
      - name: Build instrumenter
        run: |
          rustup toolchain install
          pnpm run instrumenter

      - name: Type-check e2e
        run: pnpm run e2e:typecheck

      # Builds the client for production (type-checking it as `pnpm run
      # build` does) and serves the build, so the tests see what students get.
      - name: Run e2e tests
        run: pnpm run e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
