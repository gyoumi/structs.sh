name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            e2e/package-lock.json

      # The debugger is started here rather than by Playwright, because it is
      # the part being replaced. Update this step when the backend changes.
      - name: Start debugger
        run: |
          docker compose up -d --build debugger
          timeout 120 bash -c 'until curl -sf "http://localhost:8000/dapi/?EIO=4&transport=polling" >/dev/null; do sleep 2; done'

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Install e2e
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check e2e
        working-directory: e2e
        run: npm run typecheck

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Debugger logs
        if: failure()
        run: docker compose logs debugger

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
