name: Pre-Merge Checks

on:
  pull_request:
    # edited re-checks the PR title.
    types: [opened, reopened, synchronize, edited]

jobs:
  sanity-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
      - name: TypeScript
        working-directory: ./client
        run: pnpm run tsc
      - name: Lint
        working-directory: ./client
        run: pnpm run lint
      - name: Build
        working-directory: ./client
        run: pnpm run build

  sanity-debugger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: debugger
      - name: Install debugger dependencies
        working-directory: debugger
        run: uv sync --locked --all-extras --dev
      # Security rules only for now; see [tool.ruff.lint] in pyproject.toml.
      - name: Ruff
        working-directory: debugger
        run: uv run ruff check src
      - name: Mypy
        working-directory: debugger
        run: uv run mypy src/

  sanity-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
      - name: Type-check e2e
        run: pnpm run e2e:typecheck
      - name: Lint e2e
        run: pnpm run e2e:lint --max-warnings 0
      - name: Known failures list
        run: pnpm run check:known-failures

  # The PR rules themselves run from the base branch in pr-rules.yml.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
      - name: Tests for the repo scripts
        run: pnpm run test:scripts
      # Squash merges use the PR title as the commit message, and the local
      # commit-msg hook can be skipped, so the title is checked here.
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
      - name: Dead files and missing dependencies
        run: pnpm run knip
      - name: Install Vale
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz \
            | tar xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The unslop skill's word and punctuation rules (.vale/styles/Unslop).
      - name: Prose in docs and READMEs
        run: vale docs/docs README.md client/README.md e2e/README.md
