name: Pre-Merge Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  sanity-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
      - name: TypeScript
        working-directory: ./client
        run: pnpm run tsc
      - name: Lint
        working-directory: ./client
        run: pnpm run lint
      - name: Build
        working-directory: ./client
        run: pnpm run build

  tmp-docker-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f client/Dockerfile.prod --build-arg VITE_DEBUGGER_URL=https://structs.sh -t client-prod .
      - run: docker compose build client
      - run: |
          docker compose up -d client
          timeout 120 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 2; done'
          docker compose logs client

  sanity-debugger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: debugger
      - name: Install debugger dependencies
        working-directory: debugger
        run: uv sync --locked --all-extras --dev
      # - run: uv format --check
      #   working-directory: debugger
      # - run: uv run mypy src/
      #   working-directory: debugger


