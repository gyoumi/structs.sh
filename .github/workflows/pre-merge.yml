name: Pre-Merge Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  sanity-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
      # The client's tests and build load the instrumenter's .wasm. rustup is
      # on the runner and installs the version in rust-toolchain.toml.
      - name: Build instrumenter
        run: |
          rustup toolchain install
          pnpm run instrumenter
      - name: TypeScript
        working-directory: ./client
        run: pnpm run tsc
      - name: Lint
        working-directory: ./client
        run: pnpm run lint
      - name: Unit tests
        working-directory: ./client
        run: pnpm run test
      - name: Build
        working-directory: ./client
        run: pnpm run build

  sanity-instrumenter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instrumenter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test

  sanity-debugger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: debugger
      - name: Install debugger dependencies
        working-directory: debugger
        run: uv sync --locked --all-extras --dev
      # - run: uv format --check
      #   working-directory: debugger
      # - run: uv run mypy src/
      #   working-directory: debugger


