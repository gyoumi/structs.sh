name: Pre-Merge Checks

on:
  pull_request:
    # edited re-checks the PR title.
    types: [opened, reopened, synchronize, edited]

jobs:
  sanity-client:
    runs-on: ubuntu-latest
    # A program in a unit test that never stops can't be interrupted, so cap
    # the job instead of waiting for GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
      # The client's tests and build load the instrumenter's and daily challenge's
      # .wasm. rustup is on the runner and installs the version in
      # rust-toolchain.toml.
      - name: Build wasm
        run: |
          rustup toolchain install
          pnpm run wasm
      - name: TypeScript
        working-directory: ./client
        run: pnpm run tsc
      - name: Lint
        working-directory: ./client
        run: pnpm run lint
      - name: Unit tests
        working-directory: ./client
        run: pnpm run test
      - name: Build
        working-directory: ./client
        run: pnpm run build

  sanity-instrumenter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instrumenter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test

  sanity-daily:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daily
          POSTGRES_PASSWORD: daily
          POSTGRES_DB: daily_challenges
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily -d daily_challenges"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: game-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p daily-challenges --release --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        env:
          DATABASE_URL: postgres://daily:daily@localhost:5432/daily_challenges
        run: cargo test

  sanity-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
      - name: Type-check e2e
        run: pnpm run e2e:typecheck
      - name: Lint e2e
        run: pnpm run e2e:lint --max-warnings 0
      - name: Known failures list
        run: pnpm run check:known-failures

  # The PR rules themselves run from the base branch in pr-rules.yml.
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout is shallow by default, and the comment report diffs
          # from the merge base of the PR's base and head.
          fetch-depth: 0
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@22
          cache: true
      - name: Tests for the repo scripts
        run: pnpm run test:scripts
      - name: Debugger files stay under their line limits
        run: pnpm run check:file-sizes
      - name: New comments in the debugger's code
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/report-new-comments.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      # Squash merges use the PR title as the commit message, and the local
      # commit-msg hook can be skipped, so the title is checked here.
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
      - name: Dead files and missing dependencies
        run: pnpm run knip
      - name: Install Vale
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz \
            | tar xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The unslop skill's word and punctuation rules (.vale/styles/Unslop).
      - name: Prose in docs and READMEs
        run: vale docs/docs README.md client/README.md e2e/README.md
