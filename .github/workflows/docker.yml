name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - staging
  pull_request:
    branches:
      - dev
      - staging
    paths:
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - 'client/Dockerfile.prod'
      - 'client/nginx.conf'
      - 'game-server/Dockerfile'

env:
  # Only the upstream repo can push to ghcr.io/devsoc-unsw and deploy. Forks
  # and pull requests still build the images as a check but skip login, push
  # and deploy.
  SHOULD_PUBLISH: ${{ github.repository == 'devsoc-unsw/structs.sh' && github.event_name != 'pull_request' }}
  ENVIRONMENT: ${{ github.ref_name == 'dev' && 'prod' || 'staging' }}
  IMAGE_NAME: ${{ github.ref_name == 'dev' && 'structs' || 'structs-staging' }}

jobs:
  build:
    name: "Build (${{ matrix.component }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both images build from the repo root: the client needs the pnpm
          # lockfile and both Rust crates, and the game server needs
          # rust-toolchain.toml and the game-server Cargo workspace.
          - component: client
            context: .
            dockerfile: client/Dockerfile.prod
          - component: game-server
            context: .
            dockerfile: game-server/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log into registry ghcr.io
        if: env.SHOULD_PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: ${{ env.SHOULD_PUBLISH == 'true' }}
          platforms: linux/amd64
          file: ${{ matrix.dockerfile }}
          cache-from: type=gha,scope=docker-${{ matrix.component }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=docker-{0}', matrix.component) || '' }}
          tags: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-${{ matrix.component }}:latest

  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.repository == 'devsoc-unsw/structs.sh' && github.event_name != 'pull_request'
    concurrency: ${{ github.ref_name == 'dev' && 'production' || 'staging' }}
    environment: ${{ github.ref_name == 'dev' && 'production' || 'staging' }}

    steps:
      - name: Dispatch deployment
        uses: devsoc-unsw/deployment-dispatch-action@ca2f431131318cd798762daf5921045df61c846b # no versioning scheme currently
        with:
          deployment-dispatcher-app-id: ${{ vars.DEPLOYMENT_DISPATCHER_APP_ID }}
          deployment-dispatcher-app-private-key: ${{ secrets.DEPLOYMENT_DISPATCHER_APP_PRIVATE_KEY }}
          updates: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-client=${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-game-server=${{ github.sha }}
