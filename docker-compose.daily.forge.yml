# Fills the daily stack's database with structs-forge from the private snitch
# repo instead of the fixture seeder. Needs a checkout of snitch, by default
# next to this repo:
#
#   SNITCH_DIR=../snitch docker compose -f docker-compose.daily.yml \
#     -f docker-compose.daily.forge.yml up -d --build --wait
services:
  game-seed:
    build:
      context: ${SNITCH_DIR:-../snitch}
      dockerfile: crates/structs-forge/Dockerfile
      target: !reset null
    command: ["fill", "--days", "${FORGE_DAYS:-21}"]
